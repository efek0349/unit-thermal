name: build-single-file

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ThermalScope.exe
          # Eski glibc'ye derlemek için en eski destekli Ubuntu: binary daha çok dağıtımda çalışır
          - os: ubuntu-22.04
            artifact: ThermalScope
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ThermalScope-${{ runner.os }}
          path: dist/${{ matrix.artifact }}
